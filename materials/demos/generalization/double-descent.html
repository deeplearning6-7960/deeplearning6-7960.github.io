  <h1>Double descent</h1>
  <p class="subtitle">Test error falls as the model grows, spikes when it can exactly fit every training point, then falls again — double descent.</p>

  <div class="controls">
    <div class="ctrl-row">
      <label for="sl-p">Model width w</label>
      <input id="sl-p" type="range" min="1" max="192" step="1" value="32">
      <output class="val" id="val-p" for="sl-p">32</output>
    </div>
    <div class="ctrl-row">
      <label for="sl-lam">Weight decay</label>
      <input id="sl-lam" type="range" min="0" max="100" step="1" value="0">
      <output class="val" id="val-lam" for="sl-lam">0</output>
    </div>
  </div>

  <div class="legend">
    <span class="leg"><span class="swatch" style="background:#1a1a1a"></span>test error</span>
    <span class="leg"><svg width="24" height="10" style="display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0"><line x1="0" y1="5" x2="24" y2="5" stroke="#aaa" stroke-width="2.5" stroke-dasharray="4 3"/></svg>train error</span>
  </div>

    <figure>
      <svg id="risk" class="plot" role="img" aria-label="Test error versus model width"></svg>
      <figcaption id="risk-caption" class="caption">The spike is where model width equals the number of training points, w = n.</figcaption>
    </figure>
    <figure>
      <svg id="pred" class="plot" role="img" aria-label="Model fit and training points"></svg>

<script>
'use strict';

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const N_TRAIN = 32;
const P_MAX = 6 * N_TRAIN;
const NOISE = 0.2;
const FREQ_SCALE = 40;
const FEATURE_SEED = 7919, DATA_SEED = 1;
const SCATTER_YMIN = -2, SCATTER_YMAX = 2;

function mulberry32(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(rng) {
  let u = 1 - rng();
  if (u < 1e-12) u = 1e-12;
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
}

// ── True function & random Fourier features ──────────────────────────────────
function trueSignal(x) { return Math.sin(Math.PI * x); }

// One random featurization, drawn once and held fixed: phi_j(x) = cos(omega_j x + b_j),
// with omega_j ~ N(0, FREQ_SCALE^2) and b_j ~ U[0, 2pi], all iid.
// A model of width w uses the first w features, phi_1 .. phi_w.
const OMEGAS = new Float64Array(P_MAX), BIASES = new Float64Array(P_MAX);
{
  const rng = mulberry32(FEATURE_SEED);
  for (let j = 0; j < P_MAX; j++) {
    OMEGAS[j] = gauss(rng) * FREQ_SCALE;
    BIASES[j] = rng() * 2 * Math.PI;
  }
}
function features(x) {
  const phi = new Float64Array(P_MAX);
  for (let j = 0; j < P_MAX; j++) phi[j] = Math.cos(OMEGAS[j] * x + BIASES[j]);
  return phi;
}
function predict(bhat, phi) {
  let s = 0;
  for (let j = 0; j < bhat.length; j++) s += phi[j] * bhat[j];
  return s;
}

// ── Data ─────────────────────────────────────────────────────────────────────
// Training inputs sit on a jittered grid so no two nearly coincide: exactly fitting
// two almost-identical x with different noisy labels blows up any interpolant.
const TRAIN = (() => {
  const rng = mulberry32(DATA_SEED);
  const n = N_TRAIN;
  const xs = Float64Array.from({ length: n }, (_, i) => -1 + 2 * (i + 0.5 + (rng() - 0.5) * 0.5) / n);
  const ys = Float64Array.from(xs, x => trueSignal(x) + gauss(rng) * NOISE);
  return { xs, ys, X: Array.from(xs, features) };
})();
const TEST_X = Float64Array.from({ length: 200 }, (_, i) => -1 + 2 * i / 199);
const TEST_PHI = Array.from(TEST_X, features);

// ── Fitting ──────────────────────────────────────────────────────────────────
// Ridge regression via the kernel K = X X^T (n x n), valid for every width:
//   beta = X^T (K + n lam I)^+ y.
// At lam = 0 this is least squares for w < n and the min-norm interpolant for w > n.
// K's eigendecomposition depends only on w, so it is computed once per width.
function eigSym(A) {
  const n = A.length;
  const a = A.map(r => Float64Array.from(r));
  const V = Array.from({ length: n }, (_, i) => { const r = new Float64Array(n); r[i] = 1; return r; });
  for (let sweep = 0; sweep < 60; sweep++) {
    let off = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) off += a[i][j] ** 2;
    if (off < 1e-30) break;
    for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) {
      if (Math.abs(a[p][q]) < 1e-300) continue;
      const th = (a[q][q] - a[p][p]) / (2 * a[p][q]);
      const t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1));
      const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < n; k++) { const u = a[k][p], v = a[k][q]; a[k][p] = c * u - s * v; a[k][q] = s * u + c * v; }
      for (let k = 0; k < n; k++) { const u = a[p][k], v = a[q][k]; a[p][k] = c * u - s * v; a[q][k] = s * u + c * v; }
      for (let k = 0; k < n; k++) { const u = V[k][p], v = V[k][q]; V[k][p] = c * u - s * v; V[k][q] = s * u + c * v; }
    }
  }
  return { vals: a.map((r, i) => r[i]), V };
}
const EIGS = (() => {
  const { X, ys } = TRAIN, n = N_TRAIN;
  const K = Array.from({ length: n }, () => new Float64Array(n));
  const eigs = [null];
  for (let p = 1; p <= P_MAX; p++) {
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) K[i][j] += X[i][p - 1] * X[j][p - 1];
    const { vals, V } = eigSym(K);
    const vy = vals.map((_, k) => { let s = 0; for (let i = 0; i < n; i++) s += V[i][k] * ys[i]; return s; });
    eigs.push({ vals, V, vy, max: Math.max(...vals) });
  }
  return eigs;
})();
function fitWidth(p, lam) {
  const { X, ys } = TRAIN, n = N_TRAIN;
  const { vals, V, vy, max } = EIGS[p];
  const alpha = new Float64Array(n);
  for (let k = 0; k < n; k++) {
    if (vals[k] <= 1e-15 * max) continue;  // numerically zero: K has rank min(w, n)
    const c = vy[k] / (vals[k] + n * lam);
    for (let i = 0; i < n; i++) alpha[i] += V[i][k] * c;
  }
  const bhat = new Float64Array(p);
  for (let j = 0; j < p; j++) { let s = 0; for (let i = 0; i < n; i++) s += X[i][j] * alpha[i]; bhat[j] = s; }
  let train = 0, risk = 0, norm = 0;
  for (let i = 0; i < n; i++) train += (predict(bhat, X[i]) - ys[i]) ** 2;
  for (let i = 0; i < TEST_X.length; i++) risk += (predict(bhat, TEST_PHI[i]) - trueSignal(TEST_X[i])) ** 2;
  for (const v of bhat) norm += v * v;
  return { p, bhat, train: train / n, risk: risk / TEST_X.length, norm: Math.sqrt(norm) };
}

let results = [];  // results[w] for w = 1 .. P_MAX
let curve = [];

function lamOf(slider) {
  const v = Number(slider);
  if (v <= 0) return 0;
  return 10 ** (-3 + (v / 100) * 3);
}
function formatLam(lam) {
  if (lam === 0) return '0';
  if (lam >= 0.1) return lam.toFixed(2);
  if (lam >= 0.01) return lam.toFixed(3);
  return lam.toExponential(1);
}
function fmt(v) {
  if (!Number.isFinite(v)) return '—';
  if (v < 0.001) return '< 0.001';
  if (v >= 100) return v.toFixed(0);
  if (v >= 10) return v.toFixed(1);
  return v.toFixed(2);
}
function read() {
  const lam = lamOf(+$('sl-lam').value);
  return { n: N_TRAIN, sigma: NOISE, lam, p: +$('sl-p').value, pMax: P_MAX, interpP: N_TRAIN };
}

function el(tag, attrs, parent, content) {
  const e = document.createElementNS(NS, tag);
  for (const [key, value] of Object.entries(attrs)) e.setAttribute(key, value);
  if (content !== undefined) e.textContent = content;
  parent.append(e);
  return e;
}
function chartBox(id, height) {
  const svg = $(id);
  const w = Math.max(280, Math.round(svg.clientWidth || 640));
  svg.setAttribute('viewBox', `0 0 ${w} ${height}`);
  svg.replaceChildren();
  return { svg, w, h: height };
}
function niceLogTicks(ymin, ymax) {
  const ticks = [];
  const lo = Math.floor(Math.log10(ymin));
  const hi = Math.ceil(Math.log10(ymax));
  for (let e = lo; e <= hi; e++) {
    for (const m of [1, 2, 5]) {
      const v = m * 10 ** e;
      if (v >= ymin * 0.98 && v <= ymax * 1.02) ticks.push(v);
    }
  }
  return ticks.length ? ticks : [ymin, ymax];
}
function regimeCopy(w, interpP, train) {
  const memorized = train < 0.02;
  if (w === interpP) {
    return memorized
      ? 'Width equals the interpolation threshold: the model can pass through every training point. Test error spikes.'
      : 'Weight decay keeps the model from passing through every training point, so the spike is smaller.';
  }
  if (w > interpP) {
    return memorized ? '' : 'Weight decay is strong enough that training error never hits zero.';
  }
  return 'Fewer effective parameters than training points, so the model cannot pass through every one yet.';
}

function tickLabel(v) {
  if (!Number.isFinite(v)) return '';
  if (v >= 10) return String(Math.round(v));
  if (v >= 1) return String(Math.round(v * 10) / 10);
  return String(Math.round(v * 100) / 100);
}
function axisName(svg, x, y, text, rotate) {
  if (!rotate) {
    el('text', { x, y, class: 'axis-name', 'text-anchor': 'middle' }, svg, text);
    return;
  }
  const g = el('g', { transform: `translate(${x} ${y}) rotate(${rotate})` }, svg);
  el('text', { x: 0, y: 0, class: 'axis-name', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, g, text);
}
function drawRisk(state, here) {
  const { svg, w, h } = chartBox('risk', 380);
  const m = { l: 72, r: 18, t: 28, b: 52 };
  const risks = curve.map(r => r.risk).filter(v => v > 0);
  const trains = curve.map(r => r.train).filter(v => v > 0);
  const peak = Math.max(...risks, here ? here.risk : 0, state.sigma ** 2);
  const testFloor = risks.length ? Math.min(...risks) : state.sigma ** 2;
  const trainMin = trains.length ? Math.min(...trains) : 1e-4;
  const ymin = Math.max(1e-4, Math.min(testFloor, trainMin) * 0.4);
  const ymax = Math.max(peak * 1.35, ymin * 10);
  const lo = Math.log10(ymin), hi = Math.log10(ymax);
  const map = v => m.t + (1 - (Math.log10(Math.max(v, ymin)) - lo) / (hi - lo)) * (h - m.t - m.b);
  const yOf = v => Math.max(m.t, Math.min(h - m.b, map(v)));
  const xOf = p => m.l + (p - 1) / (state.pMax - 1) * (w - m.l - m.r);

  const ticks = [];
  for (const v of niceLogTicks(ymin, ymax)) {
    const y = yOf(v);
    if (ticks.every(u => Math.abs(yOf(u) - y) > 22)) ticks.push(v);
  }
  for (const v of ticks) {
    const y = yOf(v);
    el('line', { x1: m.l, x2: w - m.r, y1: y, y2: y, stroke: '#f3f3f3' }, svg);
    el('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, svg, tickLabel(v));
  }
  const iP = state.interpP;
  el('line', { x1: xOf(iP), x2: xOf(iP), y1: m.t, y2: h - m.b, stroke: '#c8c8c8' }, svg);
  el('text', { x: Math.min(xOf(iP) + 6, w - m.r - 36), y: 16, class: 'axis-name' }, svg, 'w = n');

  const poly = (rows, key, color, width, dash) => {
    if (!rows.length) return;
    const pts = [];
    for (const r of rows) pts.push(`${xOf(r.p)},${yOf(Math.max(r[key], ymin))}`);
    el('polyline', { points: pts.join(' '), fill: 'none', stroke: color, 'stroke-width': width,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': dash }, svg);
  };
  poly(curve, 'train', '#aaa', 1.5, '4 3');
  poly(curve, 'risk', '#1a1a1a', 2.25, '');

  const x = xOf(state.p);
  el('line', { x1: x, x2: x, y1: m.t, y2: h - m.b, stroke: '#ddd' }, svg);
  if (here) el('circle', { cx: x, cy: yOf(Math.max(here.risk, ymin)), r: 4.5, fill: '#1a1a1a' }, svg);
  for (const p of [1, iP, state.pMax]) {
    el('text', { x: xOf(p), y: h - 30, 'text-anchor': p === state.pMax ? 'end' : p === 1 ? 'start' : 'middle' }, svg, String(p));
  }
  axisName(svg, 18, (m.t + h - m.b) / 2, 'error', -90);
  axisName(svg, (m.l + w - m.r) / 2, h - 8, 'model width w');
  svg.setAttribute('aria-label', here
    ? `Test error ${fmt(here.risk)} at model width ${state.p}.`
    : 'Error versus model width');
}

function drawPred(state) {
  const { svg, w, h } = chartBox('pred', 380);
  const m = { l: 48, r: 16, t: 16, b: 52 };
  const pw = w - m.l - m.r, ph = h - m.t - m.b;
  const xOf = x => m.l + (x + 1) / 2 * pw;
  const yOf = y => m.t + (1 - (y - SCATTER_YMIN) / (SCATTER_YMAX - SCATTER_YMIN)) * ph;
  const inRange = y => y >= SCATTER_YMIN && y <= SCATTER_YMAX;

  for (const v of [SCATTER_YMIN, -1, 0, 1, SCATTER_YMAX]) {
    const yy = yOf(v);
    el('line', { x1: m.l, x2: w - m.r, y1: yy, y2: yy, stroke: '#f3f3f3' }, svg);
    el('text', { x: m.l - 6, y: yy + 4, 'text-anchor': 'end' }, svg, String(v));
  }

  // True function (gray dashed)
  const N = 200;
  const truePts = Array.from({length: N}, (_, i) => {
    const x = -1 + 2 * i / (N - 1);
    return `${xOf(x)},${yOf(trueSignal(x))}`;
  });
  el('polyline', { points: truePts.join(' '), fill: 'none', stroke: '#ccc',
    'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, svg);

  // Model fit (solid dark), broken when out of chart range.
  // Include training x-positions in the grid so the curve visually passes through training dots.
  const draw = results[state.p];
  if (draw) {
    const xs = Array.from({length: N}, (_, i) => -1 + 2 * i / (N - 1));
    for (const tx of TRAIN.xs) xs.push(tx);
    xs.sort((a, b) => a - b);
    let path = '', pen = false;
    for (const x of xs) {
      const y = predict(draw.bhat, features(x));
      if (inRange(y)) {
        path += pen ? ` L ${xOf(x)} ${yOf(y)}` : `M ${xOf(x)} ${yOf(y)}`;
        pen = true;
      } else pen = false;
    }
    if (path) el('path', { d: path, fill: 'none', stroke: '#1a1a1a', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, svg);
  }

  // Training dots
  for (let i = 0; i < TRAIN.xs.length; i++) {
    const cx = xOf(TRAIN.xs[i]);
    const y = TRAIN.ys[i];
    const off = !inRange(y);
    const cy = yOf(Math.max(SCATTER_YMIN, Math.min(SCATTER_YMAX, y)));
    el('circle', off
      ? { cx, cy, r: 3, fill: 'none', stroke: '#bbb', 'stroke-width': 1.25 }
      : { cx, cy, r: 3, fill: '#333' }, svg);
  }

  axisName(svg, 14, (m.t + h - m.b) / 2, 'y', -90);
  axisName(svg, (m.l + w - m.r) / 2, h - 8, 'x');
  svg.setAttribute('aria-label', `Training data: ${TRAIN.xs.length} points`);
}

function render() {
  const state = read();
  $('val-p').textContent = String(state.p);
  $('val-lam').textContent = formatLam(state.lam);
  const here = results[state.p] ?? null;
  drawRisk(state, here);
  drawPred(state);
  const name = state.p < state.n ? 'Before the spike'
    : state.p === state.n ? 'At the spike' : 'After the spike';
  $('stats').innerHTML = `
    <span>${name}</span>
    <span>Test error <strong>${here ? fmt(here.risk) : '—'}</strong></span>
    <span>Train error <strong>${here ? fmt(here.train) : '—'}</strong></span>
    <span>Weight norm <strong>${here ? fmt(here.norm) : '—'}</strong></span>
    <span>w / n <strong>${(state.p / state.n).toFixed(2)}</strong></span>`;
  $('regime').textContent = regimeCopy(state.p, state.n, here ? here.train : 1);
}

function rebuild() {
  const { lam } = read();
  results = [null];
  for (let p = 1; p <= P_MAX; p++) results.push(fitWidth(p, lam));
  curve = results.slice(1);
  render();
}

$('sl-lam').addEventListener('input', rebuild);
$('sl-p').addEventListener('input', render);
window.addEventListener('resize', render);
rebuild();
</script>
</body>
</html>
